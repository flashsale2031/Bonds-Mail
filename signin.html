<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Bonds Mail</title><link rel="stylesheet" href="bondsmail.css"></head><body class="auth-body"><main class="auth-shell"><a class="auth-brand" href="index.html"><span class="brand-mark">B</span><span>Bonds Mail</span></a><section class="auth-card"><h1>Sign in to Bonds Mail</h1><p class="auth-subtitle">Use your personal or business account.</p><div class="account-tabs"><button class="account-tab active" data-type="personal">Personal</button><button class="account-tab" data-type="business">Business</button></div><div class="provider-grid"><button class="provider apple" data-provider="Apple"><b></b> Continue with Apple</button><button class="provider facebook" data-provider="Facebook"><b>f</b> Continue with Facebook</button><button class="provider google" data-provider="Google"><b>G</b> Continue with Google</button></div><div class="divider"><span>or sign in manually</span></div><form id="signinForm"><label id="signinLabel" class="field-label">Email address</label><input id="identity" required placeholder="Email address" autocomplete="username"><input id="password" type="password" required placeholder="Password" autocomplete="current-password"><label class="remember"><input type="checkbox" id="remember"> Keep me signed in</label><button class="primary auth-submit" type="submit">Sign in</button></form><p id="authStatus" class="auth-status"></p><p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p></section><p class="auth-note"><a href="index.html">Back to Bonds Mail</a></p></main><script src="auth.js"></script></body></html>

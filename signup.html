<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · Bonds Mail</title><link rel="stylesheet" href="bondsmail.css"></head><body class="auth-body"><main class="auth-shell"><a class="auth-brand" href="index.html"><span class="brand-mark">B</span><span>Bonds Mail</span></a><section class="auth-card"><h1>Create your Bonds Mail account</h1><p class="auth-subtitle">Choose a personal or business account.</p><div class="account-tabs"><button class="account-tab active" data-type="personal">Personal</button><button class="account-tab" data-type="business">Business</button></div><div class="provider-grid"><button class="provider apple" data-provider="Apple"><b></b> Continue with Apple</button><button class="provider facebook" data-provider="Facebook"><b>f</b> Continue with Facebook</button><button class="provider google" data-provider="Google"><b>G</b> Continue with Google</button></div><div class="divider"><span>or sign up manually</span></div><form id="signupForm"><input id="name" required placeholder="Full name" autocomplete="name"><div id="businessFields" class="business-fields hidden"><label>Business domain</label><input id="domain" placeholder="yourdomain.com" inputmode="url" autocomplete="organization"><label>Username</label><input id="username" placeholder="username" autocomplete="username"><div class="domain-preview"><span id="addressPreview">username.yourdomain.com</span></div></div><input id="email" type="email" required placeholder="Email address" autocomplete="email"><input id="password" type="password" required minlength="8" placeholder="Password (8+ characters)" autocomplete="new-password"><button class="primary auth-submit" type="submit">Create account</button></form><p id="authStatus" class="auth-status"></p><p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p></section><p class="auth-note">By creating an account, you agree to the Bonds Mail terms and privacy policy.</p></main><script src="auth.js"></script></body></html>
